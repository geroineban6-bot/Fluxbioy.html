<head>

<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark;--bg:#09090b;--mut:#a1a1aa;--dim:#52525b;--bd:rgba(255,255,255,.09)}
html{background:var(--bg)}
body{background:var(--bg);color:#fafafa;font:400 16px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit;text-decoration:none;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* language overlay */
.ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:#050506;transition:opacity .7s ease,visibility .7s ease}
.ov.off{opacity:0;visibility:hidden}
#stars{position:absolute;inset:0;width:100%;height:100%}
.ovc{position:relative;width:min(440px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.ovc .mono{color:var(--mut);letter-spacing:.14em;font-size:15px}
.ovc h2{font:600 clamp(24px,7vw,34px)/1.15 Unbounded,Inter,sans-serif;letter-spacing:-.03em;margin:8px 0 14px;text-wrap:balance}
.lb{display:flex;align-items:center;gap:14px;width:100%;padding:20px 22px;border-radius:24px;border:1px solid var(--bd);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));font-weight:600;font-size:19px;transition:background .25s,border-color .25s,box-shadow .25s,transform .15s}
.lb:hover,.lb:active{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);box-shadow:0 0 44px rgba(255,255,255,.09)}
.lb:active{transform:scale(.985)}
.lb .fl{font-size:28px;line-height:1}
.lb b{margin-left:auto;font-weight:400;color:var(--mut);transition:transform .25s,color .25s}
.lb:hover b{transform:translateX(5px);color:#fff}
.note{margin-top:12px;color:var(--dim);font-size:15px}

/* nav */
.nav{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;border:1px solid var(--bd);background:rgba(14,14,17,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tab{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;color:var(--mut);font-weight:500;font-size:15px;transition:background .25s,color .25s}
.tab:hover{color:#fff}
.tab.on{background:rgba(255,255,255,.09);color:#fff}
.tab .tx{display:none}
.tab.on .tx{display:inline}
.sep{width:1px;height:22px;margin:0 4px;background:var(--bd)}
.lang{gap:7px;font:600 13px/1 "JetBrains Mono",monospace;letter-spacing:.04em}
.lang span{color:var(--dim);transition:color .25s}
.lang span.on{color:#fff}
#snd{position:relative}#snd.mute{opacity:.5}#snd.mute::after{content:"";position:absolute;left:12px;right:12px;top:50%;height:2px;border-radius:2px;background:currentColor;transform:rotate(-45deg)}
@media(min-width:640px){.tab .tx{display:inline}}
@media(max-width:400px){.tab{padding:0 11px}.lang{gap:5px}}

/* views */
.view{display:none}
.view.on{display:block}
.rv{opacity:0;transform:translateY(14px)}
.in .view.on .rv{animation:up .8s var(--d,0s) cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}

/* about */
.hero{position:relative;isolation:isolate;min-height:100vh;min-height:100svh;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 20px 17vh;overflow:hidden}
.hero.on{display:flex}
.badge{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border:1px solid var(--bd);border-radius:999px;background:rgba(255,255,255,.03);color:#d4d4d8;font-weight:500;font-size:15px;margin-bottom:30px;--d:.05s}
.dot{width:12px;height:12px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2),0 0 14px #22c55e;animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{box-shadow:0 0 0 8px rgba(34,197,94,0),0 0 14px #22c55e}}
.hi{font:600 clamp(20px,4.6vw,30px)/1.1 Unbounded,Inter,sans-serif;letter-spacing:-.02em;color:var(--mut);--d:.12s}
.name{font:800 clamp(80px,23vw,200px)/1 Unbounded,Inter,sans-serif;letter-spacing:-.055em;padding:.04em .06em .1em;background:linear-gradient(180deg,#fff 25%,#71717a 125%);-webkit-background-clip:text;background-clip:text;color:transparent;--d:.2s}
.desc{max-width:540px;margin:22px 0 30px;color:#d4d4d8;text-shadow:0 0 14px #09090b,0 0 3px #09090b;font-size:clamp(16px,2.6vw,20px);line-height:1.5;text-wrap:balance;--d:.36s}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;--d:.44s}
.btn{display:inline-flex;align-items:center;gap:10px;height:58px;padding:0 30px;border-radius:999px;font-weight:600;font-size:17px;transition:transform .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-2px)}
.btn.w{background:#f4f4f5;color:#09090b}
.btn.w:hover{background:#fff}
.btn.g{border:1px solid rgba(255,255,255,.16);background:rgba(9,9,11,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn.g:hover{border-color:rgba(255,255,255,.4)}
.hint{position:absolute;left:0;right:0;bottom:max(5vh,28px);color:#d4d4d8;font:400 15px "JetBrains Mono",monospace;letter-spacing:.08em;text-align:center;pointer-events:none}
.hint span{display:inline-block;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
#arc{position:absolute;left:0;bottom:0;width:100%;height:62vh;height:62svh;min-height:360px;z-index:-1;pointer-events:none;background:radial-gradient(70% 70% at 50% 100%,rgba(255,255,255,.1),transparent 70%);-webkit-mask-image:linear-gradient(to top,#000 55%,transparent 98%);mask-image:linear-gradient(to top,#000 55%,transparent 98%)}

/* works */
.wrap{max-width:1040px;margin:0 auto;padding:128px 20px 64px}
.h{font:800 clamp(40px,9vw,76px)/1.05 Unbounded,Inter,sans-serif;letter-spacing:-.045em}
.h .dim{color:var(--dim)}
.sub{margin:16px 0 44px;color:var(--mut);font-size:clamp(16px,2.6vw,20px);--d:.08s}
.cards{display:grid;gap:18px}
@media(min-width:820px){.cards{grid-template-columns:1fr 1fr}}
.card{position:relative;display:flex;flex-direction:column;gap:36px;min-height:320px;padding:32px;border-radius:32px;border:1px solid var(--bd);background:linear-gradient(160deg,#141417,#0b0b0d);overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s}
.card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.24)}
.card::before{content:"";position:absolute;right:-70px;top:34%;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.2),rgba(255,255,255,.04) 48%,transparent 70%)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(320px circle at var(--x,70%) var(--y,0%),rgba(255,255,255,.09),transparent 65%)}
.card:hover::after{opacity:1}
.card>*{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card h3{font:800 clamp(26px,5vw,36px)/1.1 Unbounded,Inter,sans-serif;letter-spacing:-.04em}
.card .mono{display:block;margin-top:10px;color:#71717a;font-size:14px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(0,0,0,.4);color:#e4e4e7;font-weight:500;font-size:14px;white-space:nowrap}
.pill.mut{color:#71717a}
.pill .dot{width:10px;height:10px;box-shadow:0 0 8px #22c55e;animation:none}
.card p{max-width:min(420px,70%);margin-top:auto;color:#e4e4e7;font-size:clamp(17px,2.6vw,20px);line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tag{padding:10px 18px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.03);color:#d4d4d8;font-weight:500;font-size:14px}

@media(max-width:480px){.card{padding:26px 22px;min-height:300px}.card p{max-width:78%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}.rv{opacity:1;transform:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const MUSIC_URL=""; // необязательно: свой mp3 вместо встроенной музыки / optional: your own mp3 instead of the built-in ambient

/* i18n */
const T={
ru:{nav_about:"Обо мне",nav_works:"Работы",badge:"Java-разработчик",hi:"Привет, я",desc:"Пишу клиенты для Minecraft и сайты. Сейчас развиваю собственные проекты.",write:"Написать мне",works_btn:"Мои работы",hint:"листай вниз <span>↓</span>",works_h:"Мои <span class='dim'>работы</span>",works_p:"Проекты, над которыми я работал и работаю.",now:"Сейчас",prev:"Ранее",santa:"Собственный уникальный клиент для Minecraft с продвинутым функционалом.",lead:"Ведущий разработчик",litka:"Собственный клиент для Minecraft: владел проектом и писал код.",owner:"Владелец",coder:"Кодер"},
en:{nav_about:"About",nav_works:"Works",badge:"Java Developer",hi:"Hi, I’m",desc:"I build Minecraft clients and websites. Currently developing my own projects.",write:"Message me",works_btn:"My works",hint:"scroll down <span>↓</span>",works_h:"My <span class='dim'>works</span>",works_p:"Projects I’ve worked on and am working on.",now:"Now",prev:"Previously",santa:"A unique custom Minecraft client with advanced functionality.",lead:"Lead developer",litka:"A custom Minecraft client: I owned the project and wrote the code.",owner:"Owner",coder:"Coder"}
};
let L="ru";
function setL(l){L=l;document.documentElement.lang=l;$$("[data-i]").forEach(e=>e.innerHTML=T[l][e.dataset.i]);$$("#lang span").forEach(s=>s.classList.toggle("on",s.dataset.l===l))}

/* tabs */
const ab=$("#about"),ov=$("#ov");
function show(n){$$(".view").forEach(v=>v.classList.toggle("on",v.id===n));$$(".tab[data-t]").forEach(t=>t.classList.toggle("on",t.dataset.t===n));scrollTo(0,0);if(n==="about")size()}
$$(".tab[data-t]").forEach(t=>t.onclick=()=>show(t.dataset.t));
$$("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
$("#lang").onclick=()=>setL(L==="ru"?"en":"ru");

/* music */
/* energetic instrumental loop (no vocals): synthesized with WebAudio, no audio files */
const au=MUSIC_URL?new Audio(MUSIC_URL):null,snd=$("#snd");
let ac,mg,bus,pg,bs,NB,tmr,on=false,nt=0,si=0;
const hz=n=>440*2**((n-69)/12),SP=60/112/4, /* 112 BPM */
CH=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],RT=[45,41,48,43],AR=[0,1,2,3,2,1,4,2,0,1,2,5,4,2,3,1];
if(au){au.loop=true;au.volume=.5}
function init(){
  ac=new(window.AudioContext||window.webkitAudioContext)();
  const cp=ac.createDynamicsCompressor(),len=ac.sampleRate*2.5,ir=ac.createBuffer(2,len,ac.sampleRate),cv=ac.createConvolver(),wet=ac.createGain(),dry=ac.createGain();
  for(let k=0;k<2;k++){const d=ir.getChannelData(k);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}
  cv.buffer=ir;wet.gain.value=.4;dry.gain.value=.6;
  mg=ac.createGain();mg.gain.value=0;mg.connect(cp);cp.connect(ac.destination);
  bus=ac.createBiquadFilter();bus.type="lowpass";bus.frequency.value=3200;
  bus.connect(dry);dry.connect(mg);bus.connect(cv);cv.connect(wet);wet.connect(mg);
  pg=ac.createGain();pg.connect(bus);
  bs=ac.createBiquadFilter();bs.type="lowpass";bs.frequency.value=420;bs.connect(mg);
  NB=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const nd=NB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
}
function env(g,t,v,a,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function tone(f,t,d,v,type,a,dst){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;env(g,t,v,a,d);o.connect(g);g.connect(dst);o.start(t);o.stop(t+d+.05)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);env(g,t,.8,.002,.35);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.4)}
function nz(t,fr,ty,v,d){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=NB;f.type=ty;f.frequency.value=fr;env(g,t,v,.002,d);s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+d+.05)}
function sched(){
  if(nt<ac.currentTime)nt=ac.currentTime+.05;
  while(nt<ac.currentTime+.2){
    const t=nt,s=si%16,c=CH[(si>>4)%4],r=RT[(si>>4)%4],ns=[c[0],c[1],c[2],c[0]+12,c[1]+12,c[2]+12];
    if(s%4===0){kick(t);pg.gain.setTargetAtTime(.3,t,.004);pg.gain.setTargetAtTime(1,t+.03,.1)}
    if(s===4||s===12)nz(t,1800,"bandpass",.3,.16);
    if(s%4===2)nz(t,8000,"highpass",.16,.05);else if(s%2)nz(t,9000,"highpass",.05,.03);
    if(s%2===0)tone(hz(r+(s%8===6?12:0)),t,SP*1.9,.28,"sawtooth",.005,bs);
    tone(hz(ns[AR[s]]+12),t,.24,s%4?.05:.07,"sawtooth",.003,bus);
    if(s===0)c.concat(c[0]+12).forEach(n=>tone(hz(n),t,SP*17,.03,"triangle",.25,pg));
    if(s%4===3&&Math.random()<.35)tone(hz(ns[Math.floor(Math.random()*6)]+24),t,1.6,.03,"sine",.01,bus);
    nt+=SP;si++;
  }
}
function setMusic(v){
  on=v;snd.classList.toggle("mute",!v);clearInterval(tmr);
  if(au){v?au.play().catch(()=>{on=false;snd.classList.add("mute")}):au.pause();return}
  if(!ac)init();
  if(v){ac.resume();mg.gain.setTargetAtTime(.85,ac.currentTime,.5);nt=ac.currentTime+.1;sched();tmr=setInterval(sched,40)}
  else{mg.gain.setTargetAtTime(0,ac.currentTime,.3);setTimeout(()=>{if(!on)ac.suspend()},1500)}
}
snd.hidden=false;snd.classList.add("mute");snd.onclick=()=>setMusic(!on);

/* language overlay */
$$(".lb").forEach(b=>b.onclick=()=>{
  setL(b.dataset.l);ov.classList.add("off");document.body.classList.add("in");
  setTimeout(()=>sOn=false,800);
  setMusic(true);
});

/* starry sky */
const S=$("#stars"),sc=S.getContext("2d");let st=[],sw,sh,sOn=true;
function sInit(){const d=Math.min(devicePixelRatio||1,2);sw=innerWidth;sh=innerHeight;S.width=sw*d;S.height=sh*d;sc.setTransform(d,0,0,d,0,0);
  st=Array.from({length:Math.round(sw*sh/5000)},()=>({x:Math.random()*sw,y:Math.random()*sh,r:Math.random()*1.3+.25,p:Math.random()*6.28,v:Math.random()*.0035+.001}))}
function sDraw(t){if(!sOn)return;sc.clearRect(0,0,sw,sh);sc.fillStyle="#fff";
  for(const s of st){sc.globalAlpha=.15+.85*(.5+.5*Math.sin(t*s.v+s.p));sc.beginPath();sc.arc(s.x,s.y,s.r,0,6.283);sc.fill()}
  requestAnimationFrame(sDraw)}

/* liquid-lens arcs */
const FS=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uR,uM;uniform float uT,uS,uV;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){
  vec2 p=gl_FragCoord.xy/uR.y,m=uM/uR.y,d=p-m;
  float r=length(d),f=exp(-r*r/.1)*uS;
  p-=d*f*.5;
  p+=d/(r+1e-3)*sin(r*26.-uT*5.)*f*(.012+.03*uV);
  vec2 q=p-vec2(uR.x/uR.y*.5,-.14);
  float a=atan(q.x,q.y),rad=length(q);
  rad+=.03*sin(a*4.+uT*.5)+.025*n(vec2(a*2.,rad*3.)+uT*.07)+.01*sin(a*11.-uT*.8);
  float b=rad*6.2-uT*.04,w=fract(b),x=w*2.-1.,z=sqrt(max(1.-x*x,0.));
  vec2 rd=q/max(length(q),1e-3);
  vec3 N=normalize(vec3(rd*x*.9,z+.15)),R=reflect(vec3(0,0,-1),N);
  float env=pow(.5+.5*R.y,1.7),box=smoothstep(.5,.95,R.x*.5+R.y*.85);
  float c=mix(.015,.78,env)+box*.55+pow(max(R.y,0.),18.)*.6;
  c*=.5+.5*sin(floor(b)*1.9+a*1.5+1.);
  c*=.25+.75*smoothstep(0.,.08,w)*smoothstep(1.,.92,w);
  c*=1.-.7*smoothstep(.8,1.8,rad);
  c=.035+clamp(c,0.,1.)*.72;
  c+=(h(gl_FragCoord.xy+fract(uT))-.5)*.02;
  gl_FragColor=vec4(c,c,c*1.04,1.);
}`;
const A=$("#arc"),gl=A.getContext("webgl"),c=gl?null:A.getContext("2d");let W=0,H=0,D=1;const U={};
if(gl){
  const mk=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);return o},pg=gl.createProgram();
  gl.attachShader(pg,mk(gl.VERTEX_SHADER,"attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}"));
  gl.attachShader(pg,mk(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pg);gl.useProgram(pg);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const l=gl.getAttribLocation(pg,"a");gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  ["uR","uM","uT","uS","uV"].forEach(k=>U[k]=gl.getUniformLocation(pg,k));
}
const m={x:-999,y:-999,tx:-999,ty:-999,s:0,ts:0,vx:0,vy:0,v:0};
function size(){D=Math.min(devicePixelRatio||1,1.5);const r=A.getBoundingClientRect();W=r.width;H=r.height;A.width=W*D;A.height=H*D;if(gl)gl.viewport(0,0,A.width,A.height);else c.setTransform(D,0,0,D,0,0)}
function arcs(t){
  c.clearRect(0,0,W,H);
  
  const N=30,cx=W/2,cy=H*1.1,R0=Math.min(W,H)*.16,R1=Math.max(H*1.05,Math.min(W*.62,H*1.6)),sg=Math.max(90,W*.11),k2=2*sg*sg;
  for(let i=0;i<N;i++){
    const k=i/(N-1),R=R0+(R1-R0)*Math.pow(k,1.12);
    c.beginPath();
    for(let a=Math.PI*.96,j=0;a<=Math.PI*2.04;a+=.03,j++){
      let x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
      const w=Math.sin(a*5+t*.0007+i*.4)*3;x+=Math.cos(a)*w;y+=Math.sin(a)*w;
      const dx=x-m.x,dy=y-m.y,d2=dx*dx+dy*dy,f=Math.exp(-d2/k2)*m.s;
      if(f>.002){const d=Math.sqrt(d2)||1,rp=Math.sin(d*.07-t*.005)*f*8;x+=dx*f*.4+dx/d*rp;y+=dy*f*.4+dy/d*rp}
      j?c.lineTo(x,y):c.moveTo(x,y);
    }
    const band=.5+.5*Math.sin(k*Math.PI*6+1.2);
    c.lineWidth=.8+1.9*band*band;
    c.strokeStyle="rgba(255,255,255,"+(.1+.62*Math.pow(Math.sin(k*Math.PI*.92+.1),1.4)*(.35+.65*band))+")";
    c.stroke();
  }
}
/* spring: the lens overshoots and wobbles like liquid */
function phys(){
  m.vx=(m.vx+(m.tx-m.x)*.09)*.82;m.vy=(m.vy+(m.ty-m.y)*.09)*.82;m.x+=m.vx;m.y+=m.vy;
  m.s+=(m.ts-m.s)*.06;m.v+=(Math.min(Math.hypot(m.vx,m.vy)/18,1)-m.v)*.1;
}
function draw(t){
  gl.uniform2f(U.uR,A.width,A.height);gl.uniform2f(U.uM,m.x*D,A.height-m.y*D);
  gl.uniform1f(U.uT,t*.001);gl.uniform1f(U.uS,m.s);gl.uniform1f(U.uV,m.v);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function loop(t){if(!document.hidden&&W&&ab.classList.contains("on")){phys();gl?draw(t):arcs(t)}requestAnimationFrame(loop)}

/* pointer / touch */
function pt(x,y){const r=A.getBoundingClientRect();m.tx=x-r.left;m.ty=y-r.top;if(!m.ts){m.x=m.tx;m.y=m.ty;m.vx=m.vy=0}m.ts=1}
addEventListener("pointermove",e=>{if(e.pointerType==="mouse")pt(e.clientX,e.clientY)});
addEventListener("touchstart",e=>pt(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
addEventListener("touchmove",e=>pt(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
addEventListener("touchend",()=>m.ts=0);addEventListener("touchcancel",()=>m.ts=0);
document.documentElement.addEventListener("mouseleave",()=>m.ts=0);

/* card spotlight */
$$(".card").forEach(cd=>cd.addEventListener("pointermove",e=>{const r=cd.getBoundingClientRect();cd.style.setProperty("--x",e.clientX-r.left+"px");cd.style.setProperty("--y",e.clientY-r.top+"px")}));

addEventListener("resize",()=>{sInit();size()});
setL("ru");sInit();size();requestAnimationFrame(sDraw);requestAnimationFrame(loop);
</script>
